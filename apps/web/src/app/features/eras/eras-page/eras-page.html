<h1 class="font-display text-4xl uppercase mb-4">Czas i epoki</h1>
<ks-ai-eras-panel />

<ks-chart-card heading="Epoka akcji" [subtitle]="eraSubtitle()" [option]="eraOption()" [table]="eraTable()" height="360px"
  [empty]="eras().eras.length === 0">
  <label slot="controls" class="text-xs flex items-center gap-2 mb-2">
    <input type="checkbox" [checked]="fs.filters().erasCertainOnly" (change)="fs.update({ erasCertainOnly: !fs.filters().erasCertainOnly })" />
    Pokaż tylko epoki z pewnych źródeł (Wikidata, słowa kluczowe TMDB)
  </label>
  <p class="text-xs text-ks-muted mt-2">
    Kolor słupka = Twoja średnia ocena. Źródła: Wikidata (P2408) → słowa kluczowe TMDB → opcjonalnie AI (Twój klucz).
  </p>
</ks-chart-card>

<div class="grid gap-4 xl:grid-cols-2 mt-4">
  <ks-chart-card heading="Rok produkcji" subtitle="Liczba tytułów i średnia ocena wg dekady" [option]="decadeOption()" [table]="decadeTable()" />
  <ks-chart-card heading="Aktywność" subtitle="Liczba ocen: rok × miesiąc" [option]="heatOption()" [table]="heatTable()"
    [height]="heatHeight()" [empty]="heat().years.length === 0" [emptyText]="heatEmptyText()" />
</div>
